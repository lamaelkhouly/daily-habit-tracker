server:
  port: 8080

spring:
  application:
    name: daily-habit-tracker

  datasource:
    url: jdbc:h2:mem:habittracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Demo-only secret. In production, load this from an environment variable / secret manager.
    secret: "c2VjcmV0LWtleS1mb3ItZGFpbHktaGFiaXQtdHJhY2tlci1kZW1vLWFwcC1kby1ub3QtdXNlLWluLXByb2Q="
    expiration-ms: 86400000 # 24h
  seed:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    com.habittracker: DEBUG
